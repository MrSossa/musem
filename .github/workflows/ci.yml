name: CI

on:
  pull_request:
  push:
    branches: [main]

# CGO_ENABLED=0 is a project invariant, not a convenience: it is what keeps
# cross-compilation to macOS and Linux possible from a single machine. Pinned
# here so a regression fails the build instead of being noticed months later.
env:
  CGO_ENABLED: "0"

# Read-only by default, declared here rather than left to the repository
# setting. Nothing in this workflow writes to the repository, and a token scoped
# to what the job needs is the difference between a compromised dependency
# reading the checkout and one pushing to it.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # Tests run twice on purpose. First in the configuration we ship, to prove
      # the code works with cgo off; then under the race detector, which needs
      # cgo and therefore cannot run at CGO_ENABLED=0. The invariant is about
      # the binary we distribute, not about the test runner.
      - name: test (shipping configuration)
        run: go test ./...

      - name: test (race detector)
        run: go test -race ./...
        env:
          CGO_ENABLED: "1"

      - name: build
        run: go build -o bin/musem ./cmd/musem

      # The build setting is read back off the binary rather than inferred from
      # its symbols. An earlier version of this step grepped `go tool nm` for
      # " U _cgo", which never matches anything: the toolchain emits cgo symbols
      # as defined, not undefined, so the check passed even for a genuinely
      # cgo-linked binary. A check that cannot fail is worse than no check —
      # it reports an invariant nobody is holding.
      # Matched as fixed strings. \s is a GNU extension, and the macOS runners
      # use BSD grep, where it degrades to a literal "s" and quietly matches
      # nothing — which would fail this leg of the matrix on every pull request.
      - name: assert the binary was built without cgo
        run: |
          settings=$(go version -m bin/musem)
          if ! echo "$settings" | grep -qF 'CGO_ENABLED='; then
            echo "the binary records no CGO_ENABLED setting; this check cannot vouch for it"
            exit 1
          fi
          if ! echo "$settings" | grep -qF 'CGO_ENABLED=0'; then
            echo "binary was built with cgo enabled: CGO_ENABLED=0 was not honoured"
            exit 1
          fi
          echo "binary records CGO_ENABLED=0"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      # v8 or newer is required: .golangci.yml is a version "2" config, and the
      # action only learned to install golangci-lint v2 in v7. Pairing a v6
      # action with a v2 config fails the job however the version input is set,
      # which fails the aggregator below and blocks every pull request.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # The branch ruleset requires a status check whose context is exactly "ci".
  # A matrix job cannot provide one: GitHub appends the matrix values to every
  # context it reports, so the jobs above show up as "test (ubuntu-latest)" and
  # "test (macos-latest)" and nothing ever reports the bare name. This job is
  # that name, and it collapses the others into it.
  #
  # if: always() is load-bearing. Without it a failing dependency leaves this
  # job skipped rather than failed, which reports no status at all — and a pull
  # request waiting forever for a check that will never arrive looks exactly
  # like a slow CI run, not like a broken one.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()
    steps:
      - name: verify that every required job succeeded
        run: |
          echo "test: ${{ needs.test.result }}"
          echo "lint: ${{ needs.lint.result }}"
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.lint.result }}" != "success" ]; then
            echo "a required job did not succeed"
            exit 1
          fi
